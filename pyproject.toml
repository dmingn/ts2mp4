[project]
name = "ts2mp4"
version = "2026.08.31.0"
description = ""
authors = [{ name = "dmingn", email = "dmingn@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "logzero>=1.7.0",
    "pydantic>=2.5.3",
    "typer>=0.16.0",
]

[project.scripts]
ts2mp4 = "ts2mp4.cli:app"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.9",
]

[tool.mypy]
strict = true
exclude = [".venv", "build", "dist"]
plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = "logzero"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test.",
    "e2e: mark a test as an end-to-end test.",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "D",  # pydocstyle
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
